<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="shortcut icon" href="money.ico" type="image/x-icon" />
    <title>Organiza — Controle financeiro pessoal</title>
    <meta
      name="description"
      content="Receitas, despesas, contas e metas em um só lugar. Seu controle financeiro pessoal, privado e offline."
    />
    <style>
      /* Sistema de design: todas as cores e medidas compartilhadas ficam aqui. */
      :root {
        --background: oklch(0.976 0.004 160);
        --surface: oklch(1 0 0);
        --foreground: oklch(0.25 0.015 165);
        --muted: oklch(0.57 0.018 165);
        --primary: oklch(0.52 0.135 158);
        --primary-soft: oklch(0.96 0.025 155);
        --primary-foreground: oklch(1 0 0);
        --border: oklch(0.925 0.008 160);
        --red: oklch(0.59 0.17 25);
        --red-soft: oklch(0.97 0.016 25);
        --amber: oklch(0.73 0.145 80);
        --amber-soft: oklch(0.975 0.036 85);
        --blue: oklch(0.61 0.14 250);
        --pink: oklch(0.69 0.145 355);
        --violet: oklch(0.63 0.13 300);
        --teal: oklch(0.64 0.09 190);
        --shadow: 0 8px 32px oklch(0.25 0.015 165 / 0.07);
        --radius: 8px;
        --font: "Segoe UI", Arial, sans-serif;
      }
      [data-theme="dark"] {
        --background: oklch(0.19 0.012 165);
        --surface: oklch(0.235 0.015 165);
        --foreground: oklch(0.94 0.008 165);
        --muted: oklch(0.69 0.016 165);
        --primary: oklch(0.68 0.145 158);
        --primary-soft: oklch(0.29 0.05 158);
        --primary-foreground: oklch(0.16 0.015 165);
        --border: oklch(0.32 0.015 165);
        --red: oklch(0.72 0.15 25);
        --red-soft: oklch(0.28 0.035 25);
        --amber-soft: oklch(0.3 0.045 85);
        --shadow: 0 8px 32px oklch(0 0 0 / 0.15);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 14px var(--font);
        letter-spacing: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      button svg {
        pointer-events: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        font-weight: 650;
      }
      h2 {
        font-size: 16px;
        font-weight: 650;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
      }
      .positive {
        color: var(--primary);
      }
      .negative {
        color: var(--red);
      }
      .small {
        font-size: 12px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 15px;
        min-height: 40px;
        background: var(--surface);
        color: var(--foreground);
        font-weight: 550;
        transition: background 0.15s;
      }
      .btn:hover {
        background: var(--background);
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-foreground);
      }
      .btn.primary:hover {
        filter: brightness(0.94);
      }
      .btn.ghost {
        border: 0;
        background: transparent;
        padding: 7px;
        color: var(--muted);
      }
      .btn.danger {
        background: var(--red-soft);
        color: var(--red);
        border-color: var(--red-soft);
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        padding: 6px;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        padding: 4px 7px;
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 4px;
        font-weight: 600;
      }
      .tag.expense {
        color: var(--red);
        background: var(--red-soft);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .sidebar {
        width: 234px;
        position: fixed;
        inset: 0 auto 0 0;
        background: var(--surface);
        border-right: 1px solid var(--border);
        z-index: 20;
        padding: 32px 18px 20px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 14px 38px;
        font-size: 25px;
        font-weight: 700;
      }
      .brand-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .brand-mark svg {
        width: 23px;
        height: 23px;
      }
      .nav-caption {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--muted);
        padding: 0 16px;
        margin-bottom: 12px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        font-weight: 500;
        color: var(--muted);
        border-radius: 6px;
        margin: 3px 0;
      }
      .nav-item:hover {
        background: var(--background);
      }
      .nav-item.active {
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 650;
      }
      .nav-item.active:after {
        content: "";
        margin-left: auto;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--primary);
      }
      .sidebar-bottom {
        margin-top: auto;
      }
      .privacy {
        margin: 22px 12px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 9px;
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
      }
      .profile {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 14px 12px;
      }
      .avatar {
        height: 34px;
        width: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 12px;
        font-weight: 650;
      }
      .profile strong {
        font-size: 12px;
      }
      .profile p {
        font-size: 10px;
        margin-top: 4px;
        color: var(--muted);
      }
      .main {
        margin-left: 234px;
        min-height: 100vh;
      }
      .topbar {
        height: 76px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 38px;
      }
      .breadcrumb {
        color: var(--muted);
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .breadcrumb svg {
        width: 15px;
        height: 15px;
      }
      .breadcrumb strong {
        color: var(--foreground);
        font-weight: 500;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .local-status {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .local-status:before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--primary);
      }
      .content {
        max-width: 1440px;
        margin: auto;
        padding: 34px 38px;
      }
      .page-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 27px;
      }
      .page-heading p {
        color: var(--muted);
        margin-top: 8px;
        font-size: 13px;
      }
      .heading-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .month-switch {
        display: flex;
        align-items: center;
        gap: 4px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px;
      }
      .month-label {
        min-width: 125px;
        text-align: center;
        font-size: 12px;
        font-weight: 550;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-bottom: 24px;
      }
      .stat {
        padding: 21px 23px;
        min-height: 158px;
      }
      .stat-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .stat-icon {
        height: 34px;
        width: 34px;
        display: grid;
        place-items: center;
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 7px;
      }
      .stat-icon.red {
        background: var(--red-soft);
        color: var(--red);
      }
      .stat-icon.neutral {
        background: var(--background);
        color: var(--foreground);
      }
      .stat-value {
        font-size: 30px;
        font-weight: 650;
        margin: 11px 0 13px;
        font-variant-numeric: tabular-nums;
      }
      .stat-foot {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .stat-foot svg {
        width: 13px;
        height: 13px;
      }
      .dashboard-charts {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 22px;
        margin-bottom: 24px;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 22px 23px 0;
      }
      .panel-head p {
        margin-top: 5px;
        font-size: 11px;
        color: var(--muted);
      }
      .chart-legend {
        display: flex;
        gap: 16px;
        font-size: 10px;
        color: var(--muted);
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .dot {
        width: 8px;
        height: 8px;
        background: var(--primary);
        border-radius: 50%;
        display: inline-block;
        flex-shrink: 0;
      }
      .dot.red {
        background: var(--red);
      }
      .dot[data-color="blue"] {
        background: var(--blue);
      }
      .dot[data-color="amber"] {
        background: var(--amber);
      }
      .dot[data-color="pink"] {
        background: var(--pink);
      }
      .dot[data-color="violet"] {
        background: var(--violet);
      }
      .dot[data-color="teal"] {
        background: var(--teal);
      }
      .dot[data-color="red"] {
        background: var(--red);
      }
      .dot[data-color="green"] {
        background: var(--primary);
      }
      .flow-chart {
        height: 230px;
        padding: 28px 24px 20px;
        display: flex;
        gap: 12px;
      }
      .y-axis {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: flex-end;
        padding-bottom: 24px;
        font-size: 9px;
        color: var(--muted);
        width: 42px;
        flex-shrink: 0;
      }
      .bars {
        display: flex;
        align-items: stretch;
        justify-content: space-around;
        position: relative;
        flex: 1;
        gap: 12px;
        background: repeating-linear-gradient(
          to top,
          transparent 0,
          transparent calc(25% - 1px),
          var(--border) calc(25% - 1px),
          var(--border) 25%
        );
        margin-bottom: 24px;
      }
      .bar-group {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        position: relative;
        flex: 1;
        max-width: 46px;
      }
      .bar {
        background: var(--primary);
        width: 50%;
        border-radius: 3px 3px 0 0;
        min-height: 2px;
      }
      .bar.out {
        background: var(--red);
        opacity: 0.75;
      }
      .bar-caption {
        position: absolute;
        bottom: -24px;
        left: 50%;
        transform: translateX(-50%);
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
      }
      .donut-area {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 29px 20px;
        min-height: 230px;
      }
      .donut {
        position: relative;
        width: 156px;
        height: 156px;
        flex-shrink: 0;
      }
      .donut svg {
        width: 156px;
        height: 156px;
        transform: rotate(-90deg);
        stroke-width: 19;
      }
      .donut .track {
        stroke: var(--border);
      }
      .donut circle {
        fill: none;
        stroke-linecap: butt;
      }
      .donut-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .donut-center strong {
        font-size: 18px;
      }
      .donut-center span {
        font-size: 10px;
        color: var(--muted);
      }
      .category-legend {
        display: flex;
        flex-direction: column;
        gap: 15px;
        min-width: 136px;
        max-width: 50%;
      }
      .category-line {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
      }
      .category-line span {
        flex: 1;
      }
      .category-line strong {
        font-size: 11px;
        font-weight: 550;
        color: var(--muted);
      }
      .dashboard-bottom {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 22px;
      }
      .text-link {
        background: none;
        border: 0;
        color: var(--primary);
        font-size: 11px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .text-link svg {
        width: 14px;
        height: 14px;
      }
      .table-wrap {
        overflow-x: auto;
        margin-top: 18px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        text-align: left;
        font-size: 12px;
      }
      th {
        font-size: 10px;
        font-weight: 500;
        color: var(--muted);
        padding: 12px 23px;
        background: var(--background);
        white-space: nowrap;
      }
      td {
        padding: 16px 23px;
        border-top: 1px solid var(--border);
        white-space: nowrap;
      }
      td .description {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .category-icon {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 33px;
        height: 33px;
        border-radius: 7px;
        background: var(--background);
        color: var(--muted);
      }
      .category-icon svg {
        width: 17px;
        height: 17px;
      }
      .category-icon[data-color="green"] {
        color: var(--primary);
        background: var(--primary-soft);
      }
      .category-icon[data-color="red"] {
        color: var(--red);
        background: var(--red-soft);
      }
      .category-icon[data-color="blue"] {
        color: var(--blue);
      }
      .category-icon[data-color="amber"] {
        color: var(--amber);
        background: var(--amber-soft);
      }
      .category-icon[data-color="pink"] {
        color: var(--pink);
      }
      .category-icon[data-color="violet"] {
        color: var(--violet);
      }
      .category-icon[data-color="teal"] {
        color: var(--teal);
      }
      .description strong {
        font-size: 12px;
        font-weight: 550;
      }
      .description p {
        font-size: 10px;
        color: var(--muted);
        margin-top: 4px;
      }
      .amount {
        text-align: right;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .table-footer {
        padding: 13px 23px;
        font-size: 10px;
        color: var(--muted);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
      }
      .budget-list {
        padding: 23px;
      }
      .budget-row {
        margin-bottom: 22px;
      }
      .budget-row:last-child {
        margin: 0;
      }
      .budget-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .budget-top .left {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .budget-top .left svg {
        width: 16px;
        height: 16px;
        color: var(--muted);
      }
      .budget-amount {
        font-size: 10px;
        color: var(--muted);
      }
      .budget-amount strong {
        font-weight: 550;
        color: var(--foreground);
      }
      .progress {
        height: 6px;
        background: var(--background);
        border-radius: 6px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        border-radius: 6px;
        background: var(--primary);
      }
      .progress-fill.warning {
        background: var(--amber);
      }
      .progress-fill.exceeded {
        background: var(--red);
      }
      .budget-note {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
        margin-top: 7px;
      }
      .budget-note.warning {
        color: var(--amber);
      }
      .budget-note.exceeded {
        color: var(--red);
      }
      .bottom-note {
        margin-top: 23px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 10px;
      }
      .bottom-note span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .bottom-note svg {
        width: 12px;
        height: 12px;
      }
      .empty {
        padding: 35px 20px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .empty svg {
        display: block;
        margin: 0 auto 10px;
        width: 27px;
        height: 27px;
      }
      .filters {
        display: flex;
        gap: 12px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }
      .search {
        flex: 1;
        min-width: 200px;
        position: relative;
      }
      .search svg {
        position: absolute;
        left: 12px;
        top: 11px;
        width: 17px;
        height: 17px;
        color: var(--muted);
      }
      .search input {
        padding-left: 38px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin-bottom: 16px;
      }
      .field label {
        font-size: 12px;
        font-weight: 550;
      }
      .field input,
      .field select,
      .filters input,
      .filters select {
        height: 41px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--foreground);
        border-radius: 6px;
        padding: 0 12px;
        width: 100%;
        outline: none;
        min-width: 0;
      }
      .field input:focus,
      .field select:focus,
      .filters input:focus,
      .filters select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-soft);
      }
      .filters select {
        width: auto;
        min-width: 150px;
      }
      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
      .item-card {
        padding: 23px;
      }
      .item-card header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .item-card h2 {
        font-size: 15px;
      }
      .item-card .big {
        font-size: 26px;
        font-weight: 600;
        margin: 12px 0 20px;
      }
      .item-card .progress {
        height: 8px;
      }
      .item-card .details {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
        margin-top: 12px;
      }
      .item-card footer {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 20px;
      }
      .settings-section {
        padding: 24px 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .settings-section h2 {
        margin-bottom: 7px;
      }
      .settings-section p {
        font-size: 12px;
        color: var(--muted);
        max-width: 490px;
        line-height: 1.6;
      }
      .settings-section .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .onboarding {
        display: flex;
        align-items: center;

    <script>

          '<path d="M7 6h10l4 12-4 1-3-4h-4l-3 4-4-1L7 6Zm0 4v4m-2-2h4m7-1h.1m2 2h.1"/>',

          '<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4M3 12h18m-11 0v3h4v-3"/>',

        shield:
          '<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>',
        moon: '<path d="M20 14A9 9 0 0 1 10 3a9 9 0 1 0 10 11Z"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>',
        close: '<path d="m6 6 12 12M6 18 18 6"/>',
        edit: '<path d="m14 4 6 6M3 21l4-1L21 6l-4-4L3 16v5Z"/>',
        delete: '<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>',
        search: '<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',

        upload: '<path d="M12 15V3m-5 5 5-5 5 5M4 15v6h16v-6"/>',

        leaf: '<path d="M20 3c-8 0-15 2-15 10 0 4 4 6 7 4 7-3 8-14 8-14ZM3 21l12-12"/>',
        more: '<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
        flag: '<path d="M5 21V3m0 0c5-3 9 3 14 0v10c-5 3-9-3-14 0"/>',
      };
      const icon = (name) =>
        `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.other}</svg>`;
      const money = (n) =>
        new Intl.NumberFormat("pt-BR", {
          style: "currency",
          currency: "BRL",
        }).format(n);
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const today = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      };
      const uid = () =>
        globalThis.crypto?.randomUUID?.() ||
        `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const dateBR = (s) => s.split("-").reverse().join("/");
      const COLORS = [
        "green",
        "blue",
        "amber",
        "red",
        "pink",
        "violet",
        "teal",
      ];
      const defaultCategories = [
        ["Moradia", "home", "blue"],
        ["Alimentação", "food", "amber"],
        ["Transporte", "car", "violet"],
        ["Saúde", "health", "pink"],
        ["Lazer", "leisure", "teal"],
        ["Educação", "education", "blue"],
        ["Salário", "salary", "green"],
        ["Investimentos", "investment", "green"],
        ["Outros", "other", "red"],
      ].map((c, i) => ({
        id: `cat-${i}`,
        name: c[0],
        icon: c[1],
        color: c[2],
      }));
      const payments = [
        "Dinheiro",
        "Cartão de crédito",
        "Cartão de débito",
        "Pix",
        "Boleto",
        "Transferência",
      ];
      const fresh = () => ({
        version: 1,
        transactions: [],
        categories: defaultCategories.map((c) => ({ ...c })),
        budgets: [],
        goals: [],
        accounts: [],
        theme: "light",
        welcome: true,
      });
      // Funções financeiras puras, usadas também nos testes automatizados.
      function monthlyTotals(transactions, month) {
        return transactions
          .filter((t) => t.date.startsWith(month))
          .reduce(
            (a, t) => {
              a[t.type] += t.amount;
              return a;
            },
            { income: 0, expense: 0 },
          );
      }
      function accountBalance(account, transactions) {
        return (
          Math.round(
            (account.initial +
              transactions
                .filter((t) => t.account === account.id)
                .reduce(
                  (sum, t) =>
                    sum + (t.type === "income" ? t.amount : -t.amount),
                  0,
                )) *
              100,
          ) / 100
        );
      }
      function budgetStatus(spent, limit) {
        const percent = limit > 0 ? (spent / limit) * 100 : 0;
        return {
          percent,
          level:
            percent > 100 ? "exceeded" : percent > 80 ? "warning" : "normal",
        };
      }
      function validDate(value) {
        if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value))
          return false;
        const d = new Date(value + "T12:00:00Z");
        return (
          Number.isFinite(d.getTime()) && d.toISOString().slice(0, 10) === value
        );
      }
      function variation(current, previous) {
        return previous === 0 ? null : ((current - previous) / previous) * 100;
      }
      function validateBackup(v) {
        if (
          !v ||
          v.version !== 1 ||
          !["transactions", "categories", "budgets", "goals", "accounts"].every(
            (k) => Array.isArray(v[k]),
          )
        )
          throw Error(
            "Backup inválido. Selecione um JSON exportado pelo Organiza.",
          );
        const hasText = (s) =>
          typeof s === "string" && s.trim().length > 0 && s.length <= 200;
        const checkIds = (rows) => {
          if (
            rows.some((r) => !r || !hasText(r.id)) ||
            new Set(rows.map((r) => r.id)).size !== rows.length
          )
            throw Error("O backup contém identificadores inválidos.");

      function saveForm(event) {
        event.preventDefault();
        const form = event.target;
        if (!form.reportValidity()) return;
        const f = Object.fromEntries(new FormData(form));
        for (const k of Object.keys(f)) f[k] = String(f[k]).trim();
        let row = { id: editing || uid() };
        try {
          const positive = (v, label) => {
            const n = Number(v);
            if (!Number.isFinite(n) || n <= 0)
              throw Error(label + " deve ser maior que zero.");
            return Math.round(n * 100) / 100;
          };
          if (formKind === "transaction") {
            if (!f.description || !validDate(f.date))
              throw Error("Preencha a descrição e uma data válida.");
            row = {
              ...row,
              description: f.description,
              amount: positive(f.amount, "O valor"),
              date: f.date,
              category: f.category,
              payment: f.payment,
              account: f.account,
              type: formType,
            };
          }
          if (formKind === "category") {
            if (!f.name) throw Error("Informe um nome para a categoria.");
            if (
              state.categories.some(
                (c) =>
                  c.id !== editing &&
                  c.name.toLocaleLowerCase("pt-BR") ===
                    f.name.toLocaleLowerCase("pt-BR"),
              )
            )
              throw Error("Já existe uma categoria com esse nome.");
            row = { ...row, name: f.name, color: formColor, icon: f.icon };
          }
          if (formKind === "budget") {
            if (
              state.budgets.some(
                (b) =>
                  b.id !== editing &&
                  b.month === f.month &&
                  b.category === f.category,
              )
            )
              throw Error(
                "Já existe um orçamento para esta categoria neste mês.",
              );
            row = {
              ...row,
              category: f.category,
              limit: positive(f.limit, "O limite"),
              month: f.month,
            };
          }
          if (formKind === "goal") {
            if (!f.name || !validDate(f.deadline))
              throw Error("Informe um nome e prazo válidos.");
            const saved = Number(f.saved);
            if (!Number.isFinite(saved) || saved < 0)
              throw Error("O valor guardado não pode ser negativo.");
            row = {
              ...row,
              name: f.name,
              target: positive(f.target, "O valor alvo"),
              saved: Math.round(saved * 100) / 100,
              deadline: f.deadline,
            };
          }
          if (formKind === "account") {
            if (!f.name || !Number.isFinite(Number(f.initial)))
              throw Error("Informe nome e saldo válidos.");
            row = {
              ...row,
              name: f.name,
              kind: f.kind,
              initial: Math.round(Number(f.initial) * 100) / 100,
            };
          }
          const candidate = {
            ...state,
            [groups[formKind]]: editing
              ? state[groups[formKind]].map((x) => (x.id === editing ? row : x))
              : [...state[groups[formKind]], row],
          };
          validateBackup(candidate);
          state = candidate;
          if (persist()) {
            document.getElementById("modal").close();
            render();
            notify("Salvo com sucesso.");
          } else render();
        } catch (e) {
          document.getElementById("form-error").textContent = e.message;
        }
      }
      function confirmAction(title, message, action, label = "Confirmar") {
        const modal = document.getElementById("confirm-modal");

        modal.showModal();
        document.getElementById("confirm-action").onclick = () => {
          modal.close();
          action();
        };
      }
      function deleteItem(kind, id) {
        const item = state[groups[kind]].find((x) => x.id === id);
        if (!item) return;
        const dependent =
          kind === "category" &&
          (state.transactions.some((t) => t.category === id) ||
            state.budgets.some((b) => b.category === id));
        if (dependent) {
          notify(
            "Esta categoria está em uso. Altere os lançamentos e orçamentos antes de excluí-la.",
          );
          return;
        }
        const linked =
          kind === "account" &&
          state.transactions.some((t) => t.account === id);
        confirmAction(
          "Excluir " + names[kind] + "?",
          linked
            ? "Os lançamentos serão mantidos sem conta vinculada. O saldo inicial desta conta será removido."
            : "Esta ação não pode ser desfeita. Deseja continuar?",
          () => {
            state[groups[kind]] = state[groups[kind]].filter(
              (x) => x.id !== id,
            );
            if (kind === "account")
              state.transactions = state.transactions.map((t) =>
                t.account === id ? { ...t, account: "" } : t,
              );
            persist();
            render();
            notify("Item excluído.");
          },
          "Excluir",
        );
      }

      function download(content, filename, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }
      function exportJson() {
        if (storageError) {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              download(
                raw,
                "organiza-dados-recuperados.json",
                "application/json",
              );
              return;
            }
          } catch (e) {
            notify("Não foi possível acessar os dados anteriores.");
            return;
          }
        }
        download(
          JSON.stringify(state, null, 2),
          `organiza-backup-${today()}.json`,
          "application/json",
        );
        notify("Backup JSON exportado.");
      }

            "",
            "",
            "",
            "",
            cat(b.category).name,
            "",
            "",
            "",
            "",
            b.month,
            b.limit.toFixed(2).replace(".", ","),
          ]),
        );
        state.goals.forEach((g) =>
          rows.push([
            "Meta",
            g.id,
            g.name,
            "",
            "",
            dateBR(g.deadline),
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            g.target.toFixed(2).replace(".", ","),
            g.saved.toFixed(2).replace(".", ","),
          ]),
        );
        const safe = (v) => {
          let s = String(v ?? "");
          if (/^[=+@\-\t\r]/.test(s)) s = "'" + s;
          return '"' + s.replace(/"/g, '""') + '"';
        };
        download(
          "\ufeff" +
            rows
              .map((r) =>
                Array.from({ length: header.length }, (_, i) =>
                  safe(r[i]),
                ).join(";"),
              )
              .join("\r\n"),
          `organiza-dados-${today()}.csv`,
          "text/csv;charset=utf-8",
        );
        notify("Todos os dados exportados em CSV.");
      }
      async function downloadApp() {
        try {
          if (location.protocol === "file:") {
            download(
              "<!DOCTYPE html>\n" + document.documentElement.outerHTML,
              "organiza-financeiro.html",
              "text/html",
            );
            return;
          }
          const res = await fetch(location.pathname);
          if (!res.ok) throw Error();
          download(await res.text(), "organiza-financeiro.html", "text/html");
          notify("Abra o arquivo HTML baixado no navegador.");
        } catch (e) {
          notify(
            "Não foi possível baixar agora. Tente novamente com internet.",
          );
        }
      }
      document.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const a = btn.dataset.action,
          id = btn.dataset.id;
        if (a.startsWith("add-")) return openForm(a.slice(4));
        if (a.startsWith("edit-")) return openForm(a.slice(5), id);
        if (a.startsWith("delete-")) return deleteItem(a.slice(7), id);
        switch (a) {
          case "month-prev":
            month = shiftedMonth(-1);
            render();
            break;
          case "month-next":
            month = shiftedMonth(1);
            render();
            break;
          case "year-prev":
            reportYear--;
            render();
            break;
          case "year-next":
            reportYear++;
            render();
            break;
          case "close-modal":
            document.getElementById("modal").close();
            break;
          case "close-confirm":
            document.getElementById("confirm-modal").close();
            break;
          case "theme":
            state.theme = state.theme === "dark" ? "light" : "dark";
            applyTheme();
            persist();
            render();
            break;
          case "dismiss-welcome":
            state.welcome = false;
            persist();
            render();
            break;
          case "demo":
            confirmAction(
              "Carregar dados de exemplo?",
              "Os dados atuais serão substituídos por informações fictícias. Faça um backup antes de continuar.",
              loadDemo,
              "Carregar exemplo",
            );
            break;
          case "clear":
            confirmAction(
              "Limpar todos os dados?",
              "Esta ação apaga os dados financeiros deste navegador. Faça um backup antes de continuar.",
              () => {
                const theme = state.theme;
                state = fresh();
                state.theme = theme;
                storageError = "";
                persist();
                render();
                notify("Todos os dados foram limpos.");
              },
              "Limpar tudo",
            );
            break;
          case "export-json":
            exportJson();
            break;
          case "export-csv":
            exportCsv();
            break;
          case "import":
            document.getElementById("import-input").click();
            break;
          case "download-app":
            downloadApp();
            break;
        }
      });
      document.getElementById("import-input").onchange = async (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        if (file.size > 10 * 1024 * 1024) {
          notify("O backup deve ter no máximo 10 MB.");
          return;
        }
        try {
          const data = validateBackup(JSON.parse(await file.text()));
          confirmAction(
            "Restaurar backup?",
            "Todos os dados atuais serão substituídos pelos dados deste arquivo. Exporte seu backup atual antes de continuar.",
            () => {
              state = data;
              storageError = "";
              applyTheme();
              persist();
              render();
              notify("Backup restaurado com sucesso.");
            },
            "Restaurar backup",
          );
        } catch (error) {
          notify(error.message || "Não foi possível ler o backup.");
        }
      };
      document.getElementById("theme-toggle").onclick = () => {
        state.theme = state.theme === "dark" ? "light" : "dark";
        applyTheme();
        persist();
        if (page === "settings") render();
      };
      document.getElementById("brand-icon").innerHTML = icon("leaf");
      document.getElementById("privacy-icon").innerHTML = icon("shield");
      document.getElementById("crumb-icon").innerHTML = icon("chevron");
      window.addEventListener("hashchange", changePage);
      applyTheme();
      changePage();
    </script>
  </body>
</html>
